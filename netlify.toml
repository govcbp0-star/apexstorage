# Netlify configuration for APEXSTORAGE (Next.js 16)
# Docs: https://docs.netlify.com/frameworks/next-js/

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  # Next.js telemetry is off in CI by default; explicit for clarity
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js on Netlify: https://docs.netlify.com/frameworks/next-js/overview/
# This plugin turns Next.js API routes into Netlify Functions and handles
# ISR/SSR/Image Optimization automatically.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ----------------------------------------------------------------------
# Headers
# ----------------------------------------------------------------------

# Security & content-type defaults for every response
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Long-lived caching for Next.js static chunks
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Long-lived caching for assets served from /public
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variables documented for the Netlify UI.
# DO NOT put real secrets here. Set them in:
#   Netlify dashboard → Site settings → Environment variables
#
# Required (public, exposed to the browser):
#   NEXT_PUBLIC_FIREBASE_API_KEY
#   NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
#   NEXT_PUBLIC_FIREBASE_DATABASE_URL
#   NEXT_PUBLIC_FIREBASE_PROJECT_ID
#   NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
#   NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
#   NEXT_PUBLIC_FIREBASE_APP_ID
#   NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
#   NEXT_PUBLIC_ADMIN_EMAILS
#   NEXT_PUBLIC_NOWPAYMENTS_API_KEY
#
# Required (server-only secrets):
#   NOWPAYMENTS_IPN_SECRET
